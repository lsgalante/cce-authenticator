[package]
name = "cce-authenticator"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "331541e4f1b3489dd5a9e4fecbc2add5083b9459" }
# The raw PAM binding, for the standalone password check. The higher-level `pam`
# crate was declared next to it and never called.
pam-sys = "0.5.6"
libc = "0.2"
# passwd lookups: our own identity, and the uid polkit names in its identity list.
users = "0.8.1"
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
tokio = { version = "1", features = ["full"] }
zbus = "5"
futures = "0.3"
log = "0.4"
env_logger = "0.11"
