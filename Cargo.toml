[package]
name = "cce-authenticator"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { path = "../cce-ui" }
pam = "0.7.0"
pam-sys = "0.5.6"
libc = "0.2"
users = "0.8.1"
toml = "0.8"
smithay-client-toolkit = { version = "0.19.2", features = ["calloop"] }
calloop = "0.13.0"
calloop-wayland-source = "0.3.0"
wayland-client = { version = "0.31", features = ["system"] }
xkeysym = "0.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5"
chrono = "0.4"
futures = "0.3"
log = "0.4"
env_logger = "0.11"
